gitleaks:
  limitEnabled: true
  limit: 0
semgrep:
  severityLimit:
    error:
      enabled: true
      # Belay requires error blocking with limit <= 2 (Security Thresholds, gcp-demo-ui)
      limit: 2
grype:
  # Ignore vulnerabilities with very low Exploit Probability Scores
  epssRiskAcceptance:
    enabled: true
    score: 0.001
  # Belay requires KEV (Known Exploited Vulnerabilities) blocking
  kevLimitEnabled: true
  severityLimit:
    # Belay requires critical blocking with limit <= 11 and high blocking with limit <= 115
    critical:
      enabled: true
      limit: 11
    high:
      enabled: true
      limit: 115
cyclonedx:
  # Belay requires KEV blocking for the SBOM scan too
  kevLimitEnabled: true
coverage:
  lineThreshold: 0.5
  functionThreshold: 0.5
  branchThreshold: 0.5
